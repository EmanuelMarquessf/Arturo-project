<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="bg-white shadow-sm sticky top-0 z-10">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <div class="flex-shrink-0">
          <a
            href="/"
            class="text-3xl font-serif font-bold text-purple-900 tracking-wide hover:text-purple-700 transition duration-300"
          >
            WineLogo
          </a>
        </div>

        <nav class="hidden md:flex space-x-8 items-center relative">
          <a
            href="/"
            class="text-gray-600 font-medium text-base hover:text-purple-700 transition duration-300 ease-in-out"
          >
            Página Inicial
          </a>

          <div class="relative group" id="wine-dropdown-container">
            <button
              id="wine-dropdown-button"
              class="text-gray-600 font-medium text-base hover:text-purple-700 transition duration-300 ease-in-out flex items-center group-hover:text-purple-700"
            >
              Nossos Vinhos
              <svg
                id="wine-dropdown-arrow"
                class="ml-1 w-4 h-4 transition-transform duration-300"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </button>

            <div
              id="wine-dropdown-menu"
              class="absolute left-0 mt-0 w-48 bg-white rounded-lg shadow-xl z-20 overflow-hidden transform transition-all duration-300 origin-top border border-gray-100 hidden"
            >
              <a
                href="/vinhos-doces"
                class="block px-4 py-2 text-gray-700 text-sm hover:bg-purple-50 hover:text-purple-700 transition duration-150"
              >
                Vinhos Doces
              </a>
              <a
                href="/vinhos-tintos"
                class="block px-4 py-2 text-gray-700 text-sm hover:bg-purple-50 hover:text-purple-700 transition duration-150"
              >
                Vinhos Tintos
              </a>
            </div>
          </div>

          <a
            href="/revendedor"
            class="text-gray-600 font-medium text-base hover:text-purple-700 transition duration-300 ease-in-out"
          >
            Revendedor
          </a>
          <a
            href="/contato"
            class="border border-purple-700 text-purple-700 hover:bg-purple-700 hover:text-white rounded-full px-4 py-2 transition duration-300 font-medium text-base"
          >
            Contato
          </a>
        </nav>

        <button
          id="mobile-menu-toggle"
          class="md:hidden text-purple-900 hover:text-purple-700"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
      </div>
    </header>
    <script src="./header.js" type="module"></script>
  </body>
</html>
